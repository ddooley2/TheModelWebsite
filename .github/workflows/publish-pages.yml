name: Refresh and publish CFB dashboard

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Run weekly predictions or refresh the daily dashboard
        type: choice
        required: true
        default: weekly
        options:
          - weekly
          - daily
      season:
        description: Season to publish
        required: false
      week:
        description: Week to publish
        required: false
  schedule:
    - cron: "0 10 * * 1"
    - cron: "0 10 * * 2-6"
    - cron: "0 10 * * 0"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "data/raw/**"
      - "pyproject.toml"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1' && 'weekly' || github.event_name == 'schedule' && 'daily' || github.event_name == 'push' && 'daily' || inputs.run_type || 'weekly' }}
      SEASON_OVERRIDE: ${{ inputs.season }}
      WEEK_OVERRIDE: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Resolve publication season and week
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.cfb_model.site.schedule import resolve_publish_schedule
          season, week = resolve_publish_schedule(
              os.environ["RUN_MODE"],
              os.environ.get("SEASON_OVERRIDE") or None,
              os.environ.get("WEEK_OVERRIDE") or None,
          )
          prediction_csv = f"results/score_predictions_{season}_week{week}.csv"
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"SEASON={season}\nWEEK={week}\nPREDICTION_CSV={prediction_csv}\n")
          print(f"Publishing {season}, week {week} ({os.environ['RUN_MODE']})")
          PY
      - name: Validate required configuration
        run: |
          test -n "$CFBD_API_KEY"
          test -n "$SEASON"
          test -n "$WEEK"
          test "$RUN_MODE" = weekly -o "$RUN_MODE" = daily
      - name: Build warehouse and evaluate market-free challengers
        if: ${{ env.RUN_MODE == 'weekly' }}
        run: |
          if [ -f "$PREDICTION_CSV" ]; then
            echo "Weekly prediction already exists; preserving it."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from src.cfb_model.data.warehouse import ensure_warehouse
          from src.cfb_model.reporting.diagnostics import generate_diagnostics
          db_path = ensure_warehouse()
          report = generate_diagnostics(db_path)
          Path("candidate.txt").write_text(report["winner"]["winner"])
          print(report["winner"])
          PY
      - name: Predict the chosen candidate
        if: ${{ env.RUN_MODE == 'weekly' }}
        run: |
          if [ -f "$PREDICTION_CSV" ]; then
            echo "Weekly prediction already exists; preserving it."
            exit 0
          fi
          python -m src.cfb_model.train.score_model \
            --season "$SEASON" --predict-week "$WEEK" \
            --candidate "$(cat candidate.txt)"
          echo "PREDICTIONS_GENERATED=true" >> "$GITHUB_ENV"
      - name: Build static dashboard and retrieve display-only CFBD lines
        run: |
          args=(--season "$SEASON" --week "$WEEK" --skip-diagnostics)
          if [ "$PREDICTIONS_GENERATED" = true ]; then
            args+=(--predictions-generated)
          fi
          python -m src.cfb_model.site.build_site "${args[@]}"
      - name: Persist weekly predictions, line snapshots, and ATS results
        run: |
          if [ -f data/site/line_history.json ]; then
            git add -- data/site/line_history.json
          fi
          if [ -f data/site/ats_results.json ]; then
            git add -- data/site/ats_results.json
          fi
          if [ "$RUN_MODE" = weekly ]; then
            git add -- "$PREDICTION_CSV"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist weekly predictions and CFBD lines [skip ci]"
          if ! git push; then
            git fetch origin main
            if ! git rebase origin/main; then
              python - <<'PY'
              import json
              import subprocess
              from pathlib import Path

              conflicts = subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=U"], text=True
              ).splitlines()
              supported = {
                  "data/site/line_history.json",
                  "data/site/ats_results.json",
              }
              if not conflicts or not set(conflicts) <= supported:
                  raise RuntimeError(f"Cannot safely resolve rebase conflicts: {conflicts}")

              def stage_json(stage, path):
                  return json.loads(subprocess.check_output(
                      ["git", "show", f":{stage}:{path}"], text=True
                  ))

              for path in conflicts:
                  remote = stage_json(2, path)
                  local = stage_json(3, path)
                  if path.endswith("line_history.json"):
                      merged = {}
                      for key in remote.keys() | local.keys():
                          records = [data[key] for data in (remote, local) if key in data]
                          opening = min(
                              records,
                              key=lambda record: record.get("opening", {}).get("observed_at", ""),
                          )
                          current = max(
                              records,
                              key=lambda record: record.get("current", {}).get("observed_at", ""),
                          )
                          merged[key] = {
                              **current,
                              "opening": opening.get("opening", current.get("opening")),
                          }
                  else:
                      merged = remote
                      for season, games in local.items():
                          merged.setdefault(season, {}).update(games)
                  Path(path).write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n")
                  subprocess.run(["git", "add", path], check=True)
          PY
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
