name: Refresh and publish CFB dashboard

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Run weekly predictions or refresh the daily dashboard
        type: choice
        required: true
        default: weekly
        options:
          - weekly
          - daily
      season:
        description: Season to publish
        required: false
      week:
        description: Week to publish
        required: false
  schedule:
    - cron: "17 14 * * 1"
    - cron: "17 14 * * 2-6"
    - cron: "17 14 * * 0"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "data/raw/**"
      - "pyproject.toml"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SEASON: ${{ inputs.season || vars.CFB_SEASON }}
      WEEK: ${{ inputs.week || vars.CFB_WEEK }}
      RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '17 14 * * 1' && 'weekly' || github.event_name == 'push' && 'weekly' || inputs.run_type || 'daily' }}
      PREDICTION_CSV: results/score_predictions_${{ inputs.season || vars.CFB_SEASON }}_week${{ inputs.week || vars.CFB_WEEK }}.csv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Validate required configuration
        run: |
          test -n "$CFBD_API_KEY"
          test -n "$SEASON"
          test -n "$WEEK"
          test "$RUN_MODE" = weekly -o "$RUN_MODE" = daily
      - name: Build warehouse and evaluate market-free challengers
        if: ${{ env.RUN_MODE == 'weekly' }}
        run: |
          if [ -f "$PREDICTION_CSV" ]; then
            echo "Weekly prediction already exists; preserving it."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from src.cfb_model.data.warehouse import ensure_warehouse
          from src.cfb_model.reporting.diagnostics import generate_diagnostics
          db_path = ensure_warehouse()
          report = generate_diagnostics(db_path)
          Path("candidate.txt").write_text(report["winner"]["winner"])
          print(report["winner"])
          PY
      - name: Predict the chosen candidate
        if: ${{ env.RUN_MODE == 'weekly' }}
        run: |
          if [ -f "$PREDICTION_CSV" ]; then
            echo "Weekly prediction already exists; preserving it."
            exit 0
          fi
          python -m src.cfb_model.train.score_model \
            --season "$SEASON" --predict-week "$WEEK" \
            --candidate "$(cat candidate.txt)"
      - name: Build static dashboard and retrieve display-only CFBD lines
        run: |
          python -m src.cfb_model.site.build_site \
            --season "$SEASON" --week "$WEEK" --skip-diagnostics
      - name: Preserve weekly predictions and line snapshots
        run: |
          if [ -f data/site/line_history.json ]; then
            git add -- data/site/line_history.json
          fi
          if [ "$RUN_MODE" = weekly ]; then
            git add -- "$PREDICTION_CSV"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist weekly predictions and CFBD lines [skip ci]"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
